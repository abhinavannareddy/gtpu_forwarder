name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
          python3 -m pip install pytest
      - name: Build (warnings are errors)
        run: make
      - name: Unit tests
        run: make test-unit
      - name: Integration tests (forwarder, control socket, dashboard API)
        run: make test-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Dashboard front-end tests
        run: make test-js
      - name: AddressSanitizer and UBSan
        run: make asan
      - name: Valgrind
        run: make valgrind
      - name: Build container images
        run: |
          docker build -t gtpu-fwd .
          docker build -f Dockerfile.dashboard -t gtpu-dashboard .
