# Forwarder + control room on a private network.
#   docker compose up --build   ->  http://localhost:8765
# The control socket (unauthenticated) is reachable only inside this network;
# only the dashboard (loopback) and the GTP-U port are published.
services:
  fwd:
    build: .
    command: ["-r", "/etc/gtpu/routes.conf", "-c", "9100", "-C", "0.0.0.0"]
    volumes:
      - ./deploy/routes.compose.conf:/etc/gtpu/routes.conf:ro
    ports:
      - "2152:2152/udp"
    networks:
      gtpu: { ipv4_address: 172.28.0.10 }
    restart: unless-stopped
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    command: ["--listen", "0.0.0.0:8765", "--fwd", "172.28.0.10:2152", "--ctl", "172.28.0.10:9100",
              "--sinks", "0.0.0.0", "--traffic", "200"]
    ports:
      - "127.0.0.1:8765:8765"
    depends_on: [fwd]
    networks:
      gtpu: { ipv4_address: 172.28.0.20 }
    restart: unless-stopped
networks:
  gtpu:
    ipam:
      config:
        - subnet: 172.28.0.0/24
